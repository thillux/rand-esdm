[workspace]
members = [
    "benchmark",
    "esdm-sys",
    "esdm-tool",
    "rand-esdm",
]
default-members = ["esdm-tool"]
resolver = "2"

[workspace.package]
version = "0.4.0"
authors = ["Markus Theil <theil.markus@gmail.com>"]
edition = "2024"

[workspace.dependencies]
bindgen = { version = "0.72.1" }
clap = { version = "4.6.4", features = ["derive"] }
esdm-sys = { path = "esdm-sys", version = "0.4.0" }
getrandom = { version = "0.4.3" }
hex = { version = "0.4.3" }
libc = { version = "0.2.189" }
pkg-config = { version = "0.3.33" }
rand = { version = "0.10.2" }
rand_core = { version = "0.10.1" }
rand_xoshiro = { version = "0.8.1" }
rand-esdm = { path = "rand-esdm", version = "0.4.0" }

[workspace.lints.clippy]
all = { level = "deny", priority = 0 }
pedantic = { level = "deny", priority = 0 }
cargo = { level = "deny", priority = 0 }
cargo-common-metadata = { level = "allow", priority = 1 }
# duplicate transitive dependency versions (e.g. hashbrown via wasmparser)
# are outside of this workspace's control
multiple-crate-versions = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
missing_safety_doc = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
