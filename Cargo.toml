[workspace]
members = [
    "benchmark",
    "esdm-sys",
    "esdm-tool",
    "rand-esdm",
]
default-members = ["esdm-tool"]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Markus Theil <theil.markus@gmail.com>"]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
bindgen = { version = "0.73.2" }
clap = { version = "4.6.8", features = ["derive"] }
esdm-sys = { path = "esdm-sys", version = "0.4.0" }
getrandom = { version = "0.4.3" }
hex = { version = "0.4.3" }
libc = { version = "0.2.191" }
pkg-config = { version = "0.3.34" }
rand = { version = "0.10.4" }
rand_core = { version = "0.10.1" }
rand_xoshiro = { version = "0.8.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
rand-esdm = { path = "rand-esdm", version = "0.4.0" }
zeroize = { version = "1.9.2" }

[profile.release]
# integer overflows are bugs in code handling entropy accounting, keep
# catching them in release builds
overflow-checks = true

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 0 }
pedantic = { level = "deny", priority = 0 }
cargo = { level = "deny", priority = 0 }
cargo_common_metadata = { level = "allow", priority = 1 }
# duplicate transitive dependency versions (e.g. hashbrown via wasmparser)
# are outside of this workspace's control
multiple_crate_versions = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
missing_safety_doc = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
# every unsafe block states why its contract holds
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
