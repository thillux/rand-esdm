name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# the jobs only read the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ESDM 1.2.4 as locked in flake.lock
  ESDM_REV: 984154f7c357a8fbab02a8c6aaefff154db565cd
  ESDM_SHA256: 78578d49d1cce7f8e2b6f4adc8cd32df7ccee8298a05696def19fcbb1e98fc40
  JENT_VERSION: 3.7.0
  JENT_SHA256: f5eaccc9d2977c83308651be9379f09f34348398f419e8f8b5bbd95928c777ed

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson libprotobuf-c-dev libfuse3-dev libjson-c-dev
    - name: Install Jitter RNG
      run: |
        set -euo pipefail
        wget -O jent.tar.gz "https://github.com/smuellerDD/jitterentropy-library/archive/refs/tags/v${JENT_VERSION}.tar.gz"
        echo "${JENT_SHA256}  jent.tar.gz" | sha256sum --check --strict
        tar xfz jent.tar.gz
        make -C jitterentropy-library*
        sudo make -C jitterentropy-library* install
        sudo ldconfig
    - name: Install ESDM
      run: |
        set -euo pipefail
        wget -O esdm.tar.gz "https://github.com/thillux/esdm/archive/${ESDM_REV}.tar.gz"
        echo "${ESDM_SHA256}  esdm.tar.gz" | sha256sum --check --strict
        tar xfz esdm.tar.gz
        cd esdm-*
        meson setup build -Dselinux=disabled -Dsystemd=disabled
        meson compile -C build
        sudo meson install -C build
        sudo ldconfig
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --workspace --all-targets --locked --verbose
    - name: Start ESDM server
      run: |
        # the server daemonizes itself, the tests need it to be seeded
        sudo esdm-server
        cargo run --locked -p esdm-tool -- wait-until-seeded 60
    - name: Run tests
      run: cargo test --workspace --locked --verbose
